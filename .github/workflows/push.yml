name: Push calendar to S3 bucket

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"

jobs:
  push-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
      - name: Install pip requirements
        run: cd util && pip install -r requirements.txt
      - name: Update calendar.json
        run: cd util && touch gcaltoken.json && python update_past_events.py && rm -f gcaltoken.json
        env:
          TOKEN: ${{ secrets.TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TOKEN_URI: ${{ secrets.TOKEN_URI }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SCOPES: '["https://www.googleapis.com/auth/calendar.readonly"]'
          UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
          ACCOUNT: ${{ secrets.ACCOUNT }}
          EXPIRY: ${{ secrets.EXPIRY }}
      - name: Upload calendar.json to compatible s3 service
        uses: koraykoska/s3-upload-github-action@master
        env:
          FILE: ./front/data/calendar.json
          S3_PREFIX: public
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

