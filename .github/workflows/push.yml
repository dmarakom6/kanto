name: Push calendar to S3 bucket

on:
  workflow_dispatch:

jobs:
  push-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
      - name: Install pip requirements
        run: cd util && pip install -r requirements.txt
      - name: Update calendar.json
        run: cd util && python update_past_events.py fake-creds
      - name: Upload calendar.json to compatible s3 service
        uses: koraykoska/s3-upload-github-action@master
        env:
          FILE: ./front/data/calendar.json
          S3_PREFIX: public
          S3_ENDPOINT: ${{ secrets.TIGRIS_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.TIGRIS_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}

